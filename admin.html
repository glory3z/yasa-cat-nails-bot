<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Кабинет мастера</title>
<style>
*{box-sizing:border-box}html{width:100%;-webkit-text-size-adjust:100%}body{margin:0;width:100%;font:16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#faf8f5;color:#302b29}main{width:100%;max-width:580px;margin:auto;padding:16px 12px calc(24px + env(safe-area-inset-bottom))}h1{font-size:24px;margin:0 0 16px}h2{font-size:18px}.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-bottom:16px}.tabs button{min-width:0;padding:12px 2px;font-size:12px}.tabs .active,.primary{background:#302b29;color:white}button{font:inherit;color:#302b29;border:1px solid #e9e2dc;border-radius:10px;background:white;padding:10px;white-space:normal;overflow-wrap:anywhere;cursor:pointer;touch-action:manipulation}.card{min-width:0;max-width:100%;background:white;border:1px solid #e9e2dc;border-radius:14px;padding:12px;margin-bottom:12px}.label{display:block;font-size:13px;color:#837b76;margin:10px 0 4px}input:not([type=checkbox]),textarea{display:block;width:100%;min-width:0;max-width:100%;border:1px solid #e9e2dc;border-radius:10px;padding:10px;font:inherit;font-size:16px;background:white;color:#302b29}textarea{resize:vertical;min-height:110px}input[type=checkbox]{width:22px;height:22px;flex:0 0 22px;padding:0;margin:0;accent-color:#302b29}.check{display:flex;align-items:center;gap:10px;margin:16px 0;min-width:0}.check span{min-width:0;overflow-wrap:anywhere}.primary{width:100%;margin-top:12px;padding:14px}.row{display:grid;grid-template-columns:minmax(70px,1fr) minmax(0,2fr);gap:10px;margin:7px 0;font-size:14px}.row>*{min-width:0;overflow-wrap:anywhere}.row>:last-child{text-align:right}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.muted{color:#837b76;font-size:13px}#notice{overflow-wrap:anywhere;color:#a24c46}button:disabled{opacity:.5}
</style></head><body><main><h1>Кабинет мастера</h1><nav class="tabs"><button data-tab="bookings" class="active">Заявки</button><button data-tab="price">Прайс</button><button data-tab="schedule">Расписание</button><button data-tab="settings">Настройки</button></nav><div id="content">Загрузка…</div><p id="notice" role="status"></p></main><script>
'use strict';
let tg=window.Telegram?.WebApp;
const content=document.getElementById('content'),notice=document.getElementById('notice');let config=null,bookings=[],receipts={},tab='bookings';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>Number(v||0).toLocaleString('ru-RU')+' ₽';
const date=v=>new Date(v).toLocaleString('ru-RU',{timeZone:'Europe/Moscow',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
async function api(path,method='GET',data){const r=await fetch(path,{method,headers:{'X-Telegram-Init-Data':tg?.initData||'',...(data===undefined?{}:{'Content-Type':'application/json'})},...(data===undefined?{}:{body:JSON.stringify(data)})});const result=await r.json();if(!r.ok)throw Error(result.detail||'Ошибка запроса');return result}
async function run(button,fn){button.disabled=true;notice.textContent='';try{await fn();notice.textContent='Сохранено'}catch(e){notice.textContent=e.message}finally{button.disabled=false}}
async function load(){try{const [c,b]=await Promise.all([api('/api/admin/config'),api('/api/admin/bookings')]);config=c;bookings=b.bookings||[];receipts=b.receipts||{};render()}catch(e){notice.textContent=e.message;content.textContent='Не удалось загрузить кабинет'}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));notice.textContent='';render()});
const field=(id,label,value,type='text')=>`<label class="label" for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}">`;
const check=(id,label,value)=>`<label class="check"><input id="${id}" type="checkbox" ${value?'checked':''}><span>${label}</span></label>`;
const val=id=>document.getElementById(id).value;
const statuses={awaiting_receipt:'Ждёт чек',pending_review:'Чек на проверке',confirmed:'Подтверждена',payment_not_found:'Оплата не найдена',declined:'Отклонена',cancelled:'Отменена',reschedule_requested:'Согласуется перенос',expired:'Истекла',cancel_requested:'Запрошена отмена'};
function render(){if(!config)return;
if(tab==='bookings'){content.innerHTML=bookings.length?bookings.map(b=>{const actions=b.status==='pending_review'?[['confirm_payment','Оплата получена'],['payment_not_found','Оплата не найдена']]:b.status==='awaiting_receipt'?[['decline','Отклонить']]:b.status==='confirmed'?[['request_reschedule','Запросить перенос'],['cancel','Отменить']]:b.status==='reschedule_requested'?[['confirm_reschedule','Подтвердить перенос'],['decline','Отклонить']]:[];const rows=[['Клиент',b.client_name],['Telegram',b.telegram_username||'—'],['Услуга',b.service_name],['Дополнения',(b.addons||[]).map(a=>a.name).join(', ')||'Нет'],['Когда',date(b.starts_at)+' МСК'],['Сумма',money(b.total_rub)],['Предоплата',money(b.deposit_rub)],['Статус',statuses[b.status]||b.status],['Комментарий',b.client_comment||'—']];return `<article class="card">${rows.map(([k,v])=>`<div class="row"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join('')}<div class="actions">${(receipts[b.id]||[]).map(r=>`<button data-receipt="${esc(r.id)}">Открыть чек</button>`).join('')}${actions.map(([a,t])=>`<button data-action="${a}" data-id="${esc(b.id)}">${t}</button>`).join('')}</div></article>`}).join(''):'<div class="card">Пока нет заявок</div>';content.querySelectorAll('[data-receipt]').forEach(b=>b.onclick=()=>run(b,async()=>{const r=await api('/api/admin/receipt/'+encodeURIComponent(b.dataset.receipt));tg?.openLink?tg.openLink(r.url):window.open(r.url,'_blank','noopener')}));content.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>run(b,async()=>{await api('/api/admin/bookings/'+encodeURIComponent(b.dataset.id)+'/action','POST',{action:b.dataset.action});await load()}));}
if(tab==='settings'){const s=config.settings||{};content.innerHTML=`<div class="card">${field('deposit','Предоплата, ₽',s.deposit_rub??500,'number')}${field('phone','Телефон для перевода',s.payment_phone||'','tel')}${field('bank','Банк',s.payment_bank||'')}<label class="label" for="cancel">Условия отмены</label><textarea id="cancel">${esc(s.cancellation_terms||'')}</textarea><label class="label" for="reschedule">Условия переноса</label><textarea id="reschedule">${esc(s.reschedule_terms||'')}</textarea>${check('enabled','Приём заявок включён',s.booking_enabled)}<button class="primary" id="save">Сохранить настройки</button></div>`;document.getElementById('save').onclick=function(){run(this,async()=>{await api('/api/admin/settings','PUT',{deposit_rub:Number(val('deposit')),payment_phone:val('phone'),payment_bank:val('bank'),cancellation_terms:val('cancel'),reschedule_terms:val('reschedule'),booking_enabled:document.getElementById('enabled').checked});await load()})};}
if(tab==='price'){content.innerHTML=['services','addons'].map(group=>`<h2>${group==='services'?'Услуги':'Дополнения'}</h2>${(config[group]||[]).map((r,i)=>{const p=group+i;return `<div class="card" data-group="${group}" data-index="${i}">${field(p+'name','Название',r.name)}${group==='services'?field(p+'description','Описание',r.description):''}<div class="pair"><div>${field(p+'minutes','Минут',r.minutes,'number')}</div><div>${field(p+'price','Цена',r.price,'number')}</div></div>${check(p+'active','Активно',r.active)}</div>`}).join('')}<button class="primary" data-save="${group}">Сохранить ${group==='services'?'услуги':'дополнения'}</button>`).join('');content.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>run(b,async()=>{const g=b.dataset.save;const rows=config[g].map((r,i)=>{const p=g+i;return {id:r.id,name:val(p+'name'),...(g==='services'?{description:val(p+'description')}:{}),minutes:Number(val(p+'minutes')),price:Number(val(p+'price')),active:document.getElementById(p+'active').checked}});await api('/api/admin/'+g,'PUT',{[g]:rows});await load()}));}
if(tab==='schedule'){content.innerHTML=`<div class="card">${field('date','Дата','','date')}${field('time','Время','11:00','time')}${field('minutes','Длительность, минут',120,'number')}<button class="primary" id="add">Добавить окно</button></div>${(config.availability||[]).map(s=>`<div class="card"><p>${esc(date(s.starts_at))} — ${esc(date(s.ends_at))} МСК</p><button data-delete="${esc(s.id)}">Удалить</button></div>`).join('')}`;document.getElementById('add').onclick=function(){run(this,async()=>{await api('/api/admin/availability','POST',{date:val('date'),time:val('time'),minutes:Number(val('minutes'))});await load()})};content.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>run(b,async()=>{await api('/api/admin/availability/'+encodeURIComponent(b.dataset.delete),'DELETE');await load()}));}
}
function boot(){tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();load();}
let started=false;
function start(){if(started)return;started=true;boot();}
if(tg){start();}else{const script=document.createElement('script');script.src='https://telegram.org/js/telegram-web-app.js';script.onload=start;script.onerror=start;document.head.appendChild(script);setTimeout(start,1500);}
</script></body></html>
